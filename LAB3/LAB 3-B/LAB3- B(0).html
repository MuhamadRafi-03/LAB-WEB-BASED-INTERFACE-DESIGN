<!DOCTYPE html>
<!-- fix: Missing HTML tag was implicitly the document structure; ensure <!DOCTYPE html> is the first line -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Ticket Booking</title>
</head>
<body>

    <div id="header">
        <!-- fix: Ensure <span> is closed BEFORE </h1> to avoid "End tag h1 seen, but there were open elements" -->
        <h1>e-Ticket <span>Your Campus Cinema</span></h1>
    </div>

    <!-- fix: Wrong tag name, should be "div" instead of "span" as block elements like <h2> cannot be inside inline <span> elements -->
    <div id="content">
        <h2>Book Your Ticket</h2>
        
        <!-- fix: Replaced raw '<' with '&lt;' and fixed malformed '&amp' to '&amp;' -->
        <p>Promotion: tickets &lt; RM10 for students &amp; staff!</p>
        
        <!-- fix: Added Number() to oninput so it adds mathematically instead of joining strings (e.g. 1 + 1 = 2 instead of 11) -->
        <form action="booking.php" oninput="total.value = Number(adult.value) + Number(child.value)">
            
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus><br>
            
            <label for="email">E-mail:</label>
            <!-- fix: Corrected spelling from type="emial" to type="email" -->
            <input type="email" id="email" name="email"><br>
            
            <label for="date">Show date:</label>
            <input type="date" id="date" name="date"><br>
            
            <label for="movie">Movie:</label>
            <input id="movie" name="movie" list="movies"><br>
            <!-- fix: Changed id from "movielist" to "movies" to match the input's list="movies" attribute -->
            <datalist id="movies">
                <option value="Space Rangers">
                <option value="Kampung Comedy">
            </datalist>
            
            <label for="adult">Adult tickets:</label>
            <input type="number" id="adult" name="adult" value="0"><br>
            
            <label for="child">Child tickets:</label>
            <input type="number" id="child" name="child" value="0"><br>
            
            <label for="rating">Rate our service:</label>
            <!-- fix: Swapped min and max values so min="1" and max="5" (previously min="5" max="1") -->
            <input type="range" id="rating" name="rating" min="1" max="5"><br>
            
            <!-- fix: Changed for="adult kid" to for="adult child" to match the actual input IDs -->
            Total tickets: <output name="total" for="adult child">0</output><br>
            
            <input type="submit" value="Book Now">
        </form>
    <!-- fix: Changed the closing </span> to </div> to correctly close the <div id="content"> -->
    </div>

    <div id="footer">
        <!-- fix: Changed &Copy; to &copy; (HTML entities are case-sensitive) -->
        <p>&copy; 2026 CineKampus. All rights reserved.</p>
    </div>

</body>
</html>
<!-- fix: Removed the duplicate closing tags and stray text "54 </body> </html>" from the end of the file -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock , Paper , Scissors Game</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Rock,Paper,Sissors Game</h1>
        <p>Enter your name, Click Start Game</p>
        </header>

        <section id="player-section">
            <label for ="player-name">Player Name:</label>
            <input type="text" id="player-name" placeholder="Enter your name">
            <button onclick="startGame()">Start Game</button>
            <p> id="gretting"></p>
        </section>

        <section id = "game-section">
            <div class ="buttons">
                <button onclick="playRound('rock')">Rock</button>
                <button onclick="playRound('paper')">Paper</button>
                <button onclick="playRound('scissors')">Scissors</button>
            </div>

            <div class="choices-display">
                <div>
                    <h3>Your Choice:</h3>
                <img id ="playerImg"src ="rock.png" alt="Player Choice">
                </div>
                <div>
                    <h3>Computer :</h3>
                <img id ="computerImg"src ="rock.png" alt="Computer Choice">
                </div>
            </div>
        </section>

        <section id="result-section">
         <p id="result"></p>
         <div class="scoreboard">
            <p> Wins: <span id="wins">0</span></p>
            <p> Losses: <span id="losses">0</span></p>
            <p> Draws: <span id="draws">0</span></p
            </div>
        </section>   
        <section id="history-section">
        <h2>Match History</h2>
        <table id="history">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>You</th>
                    <th>Computer</th>
                    <th>Result</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                </tbody>
        </table>
    </section>

   
    <section id="controls-section">
        <button onclick="showSummary()">Show Summary</button>
        <button onclick="resetGame()">Reset</button>
        <p id="summaryText"></p>
    </section>

    
    <footer>
        <p id="startTime"></p>
        <p>© 2026 Computer Science Club</p>
    </footer>

    <script src="game.js"></script>
</body>
</html>

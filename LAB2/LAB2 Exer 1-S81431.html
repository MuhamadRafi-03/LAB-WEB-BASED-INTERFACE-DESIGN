<!DOCTYPE html>
<html>
<head>
    <title>Simple HTML Task</title>
</head>
<body>

    <header>
        <h1>My Page</h1>
    </header>

    <nav>
        <p>Menu</p>
    </nav>

    <section>
        <h2>User Form</h2>
        <form>
            Name: <input type="text"><br>
            Email: <input type="email"><br>
            
            Gender: 
            <input type="radio" name="gender"> Male 
            <input type="radio" name="gender"> Female<br>
            
            Hobbies: 
            <input type="checkbox"> Reading 
            <input type="checkbox"> Sports 
            <input type="checkbox"> Music<br>
            
            <button type="submit">Submit</button>
        </form>
    </section>

    <article>
        <h2>User Data</h2>
        <table border="1">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Occupation</th>
            </tr>
            <tr>
                <td>Ali</td>
                <td>21</td>
                <td>Student</td>
            </tr>
            <tr>
                <td>Hakim</td>
                <td>22</td>
                <td>Gamer</td>
            </tr>
            <tr>
                <td>Khairul</td>
                <td>19</td>
                <td>Artist</td>
            </tr>
        </table>
    </article>

    <footer>
        
    </footer>

</body>
</html>
